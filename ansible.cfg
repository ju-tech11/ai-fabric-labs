# 용도: 프로젝트 최상위에서 ansible-playbook 실행 시 자동 적용
[defaults]
# 기본 토폴로지. 다른 토폴로지는 실행 시 -i inventories/<이름>/hosts.yml
inventory = inventories/compute-rail-nospine/hosts.yml
roles_path = roles
# tests/ 아래 playbook도 fabric.py(링크·IP 계산) 필터를 쓰도록
filter_plugins = playbooks/filter_plugins
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
