# 용도: 모든 장비 공통 규칙. 스파인 없는 single-tier, 플레인 간 링크·BGP·VXLAN 없음. (원본 저장소의 group_vars/all/common.yml 역할)
---
fabric_name: compute-rail-nospine
cl_version: "5.16.1"

# 규모·주소 규칙
rail_count: 8
planes: [{name: a, octet: 10}, {name: b, octet: 20}]   # 순서 = 서버 NIC 순서(A, B)
vlan_base: 100                          # rail r → VLAN 100+r
server_ip_format: "10.{octet}.{rail}.{node}"
prefix_len: 24
server_mtu: 9000
server_iface_format: "eth{index}"       # Air 기준. 실장비는 server_iface_map으로 덮어씀
server_iface_map: {}                    # 예) {a-0: enp27s0f0np0, b-0: enp27s0f1np1, ...}

# 테스트 라이브러리 (tests/) → tests/README.md
#   rdma_mode  soft : Air 등 가상 NIC. Soft-RoCE(rdma_rxe)로 rail NIC마다 RDMA 장치 rxe_<plane><rail> (예: rxe_a0=eth1)
#              hw   : 실장비 ConnectX. 드라이버는 장비 OS 것 사용 (soft-roce 설치 건너뜀)
rdma_mode: soft
rdma_link: ethernet                     # ethernet(RoCE) / infiniband → NCCL GID·TC 설정 여부
rdma_dev_map: {}                        # 실장비: {a-0: mlx5_0, b-0: mlx5_1, ...} (`rdma link`로 확인). 비우면 rxe_<plane><rail>

# 스위치 포트 규칙
subports_per_cage: 2                    # 800G → 2x400G : swpNs0, swpNs1
switch_cage_count: 64                   # SN5610
leaf_parent_format: "swp{cage}"
leaf_port_format: "swp{cage}s{sub}"
uplink_ports: []                        # 스파인 없음. 스파인 버전은 README '스파인 있는 버전' 참고

# 환경 (Air ↔ 실장비에서 다른 값)
breakout_enabled: false                 # 실장비 true
breakout_mode: "2x"
roce_enabled: true                      # VX에서 apply 실패 시 false
roce_mode: lossless
mgmt_vrf: mgmt
mgmt_mode: dhcp                         # Air: OOB DHCP가 아래 IP를 MAC 기준으로 고정 할당 / 실장비: static

# 관리망 (eth0). IP = 형식에 host_vars의 id를 대입 (Air 규칙: 192.168.0.0/16 안, .255 금지)
mgmt_subnet: 192.168.0.0/16             # 실장비 static 모드의 prefix
mgmt_gateway: 192.168.255.254           # 실장비 static 모드의 기본 경로 (Air는 서브넷별 기본 게이트웨이 .254 사용)
mgmt_ip_format:  {switch: "192.168.0.{id}",  server: "192.168.10.{id}"}
mgmt_mac_format: {switch: "44:38:39:22:01:{id:02x}", server: "44:38:39:11:01:{id:02x}"}   # Air 토폴로지용
bridge_name: br_default

# Air 노드 사양 (토폴로지 생성용)
air_switch: {os: "cumulus-vx-{{ cl_version }}", cpu: 2, memory: 4096, storage: 20, nic_model: virtio}
air_server: {os: "generic/ubuntu2204", cpu: 2, memory: 2048, storage: 20, nic_model: e1000}   # 데모는 1 CPU / 1024
air_oob: {server: {cpu: 2, memory: 2048, storage: 20}, switch: {cpu: 5, memory: 5120, storage: 20}}
air_layout: {x0: 825, dx: 550, y_switch: 0, y_server: 550, y_oob: -275}   # 캔버스 배치 좌표

# ★ 계산 결과: 모든 템플릿·playbook이 이것만 참조
fabric: "{{ {'rail_count': rail_count, 'planes': planes, 'vlan_base': vlan_base, 'server_ip_format': server_ip_format,
             'prefix_len': prefix_len, 'server_iface_format': server_iface_format, 'subports_per_cage': subports_per_cage,
             'switch_cage_count': switch_cage_count, 'leaf_parent_format': leaf_parent_format,
             'leaf_port_format': leaf_port_format, 'uplink_ports': uplink_ports} }}"
fabric_links_all: "{{ groups['leaf'] | map('extract', hostvars) | list
                      | fabric_links(groups['servers'] | map('extract', hostvars) | list, fabric, server_iface_map) }}"
fabric_uplinks_all: "{{ groups['leaf'] | map('extract', hostvars) | list
                        | fabric_uplinks(groups['spine'] | default([]) | map('extract', hostvars) | list, fabric) }}"
