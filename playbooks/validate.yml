# 용도: 검증. ① 서버 ping 전수(같은 플레인·rail) ② BGP 이웃 ③ 포트 up / MAC 학습 → results/summary.txt
---
- name: ① 서버 ping
  hosts: servers
  gather_facts: false
  tasks:
    - ansible.builtin.shell: |
        {% for t in fabric_links_all | fabric_ping_targets(inventory_hostname) %}
        ping -c2 -i0.2 -W1 -I {{ t.iface }} {{ t.dst_ip }} >/dev/null 2>&1 && echo "OK {{ t.iface }}->{{ t.dst_host }}" || echo "FAIL {{ t.iface }}->{{ t.dst_host }} {{ t.dst_ip }}"
        {% endfor %}
      args: {executable: /bin/bash}
      register: ping
      changed_when: false
    - ansible.builtin.set_fact:
        ping_ok: "{{ ping.stdout_lines | select('match', '^OK') | list | length }}"
        ping_fail: "{{ ping.stdout_lines | select('match', '^FAIL') | list }}"

- name: ②③ 스위치 상태
  hosts: switches
  gather_facts: false
  become: true
  tasks:
    - ansible.builtin.command: "{{ item }}"
      loop:
        - vtysh -c 'show bgp summary json'
        - ip -j link show
        - bridge -j fdb show
      register: raw
      changed_when: false
    - ansible.builtin.set_fact:
        want_ports: "{{ (fabric_links_all | selectattr('leaf', 'equalto', inventory_hostname) | map(attribute='leaf_port') | list)
                       + (fabric_uplinks_all | selectattr('leaf', 'equalto', inventory_hostname) | map(attribute='leaf_port') | list)
                       + (fabric_uplinks_all | selectattr('spine', 'equalto', inventory_hostname) | map(attribute='spine_port') | list) }}"
        srv_ports: "{{ fabric_links_all | selectattr('leaf', 'equalto', inventory_hostname) | map(attribute='leaf_port') | list }}"
        bgp_peers: "{{ (raw.results[0].stdout | from_json).ipv4Unicast.peers | default({}) }}"
        links_up: "{{ raw.results[1].stdout | from_json | selectattr('operstate', 'equalto', 'UP') | map(attribute='ifname') | list }}"
        mac_ports: "{{ raw.results[2].stdout | from_json | rejectattr('state', 'defined') | selectattr('ifname', 'defined') | map(attribute='ifname') | list }}"
    - ansible.builtin.set_fact:
        bgp_up: "{{ bgp_peers | dict2items | selectattr('value.state', 'equalto', 'Established') | list | length }}"
        bgp_want: "{{ (fabric_uplinks_all | selectattr('leaf', 'equalto', inventory_hostname) | list | length)
                     + (fabric_uplinks_all | selectattr('spine', 'equalto', inventory_hostname) | list | length) }}"
        ports_down: "{{ want_ports | difference(links_up) }}"
        no_mac: "{{ srv_ports | difference(mac_ports) }}"

- name: 요약
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.set_fact:
        summary: |-
          {% for h in groups['servers'] %}
          {{ h }}: ping OK {{ hostvars[h].ping_ok | default('?') }} / FAIL {{ hostvars[h].ping_fail | default([]) | length }} {{ hostvars[h].ping_fail | default([]) | join(' | ') }}
          {% endfor %}
          {% for h in groups['switches'] %}
          {{ h }}: BGP {{ hostvars[h].bgp_up | default('?') }}/{{ hostvars[h].bgp_want | default('?') }}, down {{ hostvars[h].ports_down | default(['?']) | join(',') or '-' }}, MAC없음 {{ hostvars[h].no_mac | default(['?']) | join(',') or '-' }}
          {% endfor %}
    - ansible.builtin.copy: {content: "{{ summary }}\n", dest: "{{ playbook_dir }}/../results/summary.txt", mode: "0644"}
    - ansible.builtin.debug: {msg: "{{ summary.split('\n') }}"}
